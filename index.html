<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Premium E-Gift Card</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #10b981;
            --accent-hover: #059669;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .page {
            display: none;
            padding: 40px 20px;
            max-width: 800px;
            width: 100%;
            box-sizing: border-box;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
        }

        .page.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        h2 {
            font-size: 1.5rem;
            color: var(--text-muted);
            font-weight: 400;
            margin-bottom: 30px;
        }

        p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        button {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
        }

        button:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            transition: transform 0.3s ease, border-color 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: rgba(16, 185, 129, 0.4);
        }

        .card img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            margin-bottom: 15px;
            object-fit: cover;
        }

        .card button {
            width: 100%;
            padding: 10px 20px;
            font-size: 14px;
        }

        .status-box {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--accent-color);
            padding: 15px;
            border-radius: 12px;
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div id="page1" class="page active">
        <h1>🎁 Congratulations!</h1>
        <h2>Here's your e-Gift Card.</h2>
        <p>Click below to choose your preferred reward.</p>
        <button onclick="next()">Claim My Gift</button>
    </div>

    <div id="page2" class="page">
        <h1>Choose Your Gift Card</h1>
        <h2>Select one of the premium options below</h2>
        <div class="cards">
            <!-- Replace the src values with your image URLs later -->
            <div class="card">
                <img src="https://via.placeholder.com/250x150?text=Gift+Card+1">
                <button onclick="finish()">Get This One</button>
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/250x150?text=Gift+Card+2">
                <button onclick="finish()">Get This One</button>
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/250x150?text=Gift+Card+3">
                <button onclick="finish()">Get This One</button>
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/250x150?text=Gift+Card+4">
                <button onclick="finish()">Get This One</button>
            </div>
        </div>
    </div>

    <div id="page3" class="page">
        <h1>✅ Success!</h1>
        <h2>Your gift card has been reserved.</h2>
        <div class="status-box">
            <p style="margin:0; color: var(--text-main);"><b>Status:</b> Shipping is being processed.</p>
        </div>
    </div>

    <script>
        function next(){
            switchPage("page1", "page2");
        }

        function finish(){
            switchPage("page2", "page3");
        }

        function switchPage(oldId, newId) {
            const oldPage = document.getElementById(oldId);
            const newPage = document.getElementById(newId);
            
            oldPage.classList.remove("active");
            newPage.style.display = "block";
            
            // Allow display block to register before animating
            setTimeout(() => {
                newPage.classList.add("active");
            }, 50);
            
            setTimeout(() => {
                oldPage.style.display = "none";
            }, 500);
        }
    </script>
</body>
</html>
